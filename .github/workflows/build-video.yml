name: Build Video

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube URL to download'
        required: true
        type: string

jobs:
  build-video-job:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install yt-dlp and dependencies
        run: |
          pip install -U yt-dlp
          sudo apt-get update && sudo apt-get install -y nodejs

      - name: Download YouTube video
        run: "yt-dlp -f best --no-check-certificates --user-agent 'Mozilla/5.0' --extractor-args 'youtube:player_client=android' --js-runtimes nodejs -o 'video.mp4' '${{ inputs.youtube_url }}'"

      - name: Upload to transfer.sh and get public URL
        id: upload
        run: |
          URL=$(curl --upload-file video.mp4 https://transfer.sh/video.mp4)
          echo "download_url=$URL" >> $GITHUB_OUTPUT

      - name: Output download URL
        run: "echo 'Download URL: ${{ steps.upload.outputs.download_url }}'"
